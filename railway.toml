# Railway deployment configuration.
# - Build: Nixpacks detects the Bun project (bun.lock) and runs bun install.
# - Pre-deploy: applies pending Prisma 8 migrations before traffic is routed.
# - Start: launches the Hono server on the platform-provided PORT (0.0.0.0).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "bun run start"
preDeployCommand = "bun run dbi:migrate"
preDeployTimeoutSeconds = 300
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1